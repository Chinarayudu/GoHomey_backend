services:
  - type: web
    name: gohomeyy-backend
    runtime: node
    plan: free
    region: ohio # or oregon, frankfurt, etc.
    buildCommand: npm install --include=dev && npx prisma db push --accept-data-loss && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_USERNAME
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_TLS
        value: 'true'
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      # Fixed login for Google Play / App Store reviewers (skips Twilio).
      # Give these same values to Google in Play Console → App content → App access.
      - key: REVIEW_TEST_PHONE
        value: '+911234567890'
      - key: REVIEW_TEST_OTP
        value: '123456'
      - key: SHADOWFAX_API_TOKEN
        sync: false
      - key: SHADOWFAX_CREDITS_KEY
        sync: false
      - key: SHADOWFAX_CLIENT_CODE
        sync: false
      - key: SHADOWFAX_API_MODE
        value: testing
      - key: SHADOWFAX_BASE_URL
        sync: false
      - key: SHADOWFAX_USE_STAGING_SERVICEABLE_COORDS
        value: 'true'
      - key: HOMEY_PLATFORM_FEE_RUPEES
        value: '20'
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FUEL_SCHEDULER_ENABLED
        value: 'true'
